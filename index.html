<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mamta Saree - Admin Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="loader">
            <div class="spinner"></div>
            <p id="loading-message">Loading...</p>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Main Container -->
    <div class="app-container">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-store"></i>
                    <span class="logo-text">Mamta Saree</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <div class="menu-item active" data-tab="dashboard">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </div>
                <div class="menu-item" data-tab="products">
                    <i class="fas fa-box"></i>
                    <span>Products</span>
                </div>
                <div class="menu-item" data-tab="orders">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Orders</span>
                </div>
                <div class="menu-item" data-tab="payments">
                    <i class="fas fa-credit-card"></i>
                    <span>Payments</span>
                </div>
                <div class="menu-item" data-tab="customers">
                    <i class="fas fa-users"></i>
                    <span>Customers</span>
                </div>
                <div class="menu-item" data-tab="leads">
                    <i class="fas fa-fire"></i>
                    <span>Leads</span>
                </div>
                <div class="menu-item" data-tab="daily-report" onclick="switchTab('daily-report')">
                    <i class="fas fa-chart-bar"></i>
                    <span>Daily Report</span>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <div class="business-info">
                    <i class="fas fa-phone"></i>
                    <span>9905887725</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <button id="toggle-sidebar" class="btn-icon">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 id="page-title">Dashboard</h1>
                </div>


                

                
                <div class="header-right">
                    <!-- Notification Bell -->
                    <div class="notification-wrapper">
                        <button class="btn-icon notification-btn" onclick="toggleNotifications()" title="Notifications">
                            <i class="fas fa-bell"></i>
                            <span id="notification-badge" class="notification-badge">0</span>
                        </button>
                        <div id="notifications-dropdown" class="notifications-dropdown">
                            <div class="notifications-header">
                                <h4><i class="fas fa-bell"></i> Notifications</h4>
                                <button class="btn-sm" onclick="checkNotifications()" title="Refresh">
                                    <i class="fas fa-sync-alt"></i>
                                </button>
                            </div>
                            <div id="notifications-panel">
                                <!-- Notifications will be rendered here -->
                            </div>
                        </div>
                    </div>
                    
                    <!-- Refresh Button -->
                    <button id="refresh-btn" class="btn btn-outline" onclick="loadAllData()">
                        <i class="fas fa-sync-alt"></i>
                        <span>Refresh</span>
                    </button>
                </div>
            </header>

            <!-- Dashboard Tab -->
            <section id="dashboard-tab" class="tab-content active">
                <div id="dashboard-stats" class="stats-grid"></div>
                <div class="dashboard-grid">
                    <div class="card">
                        <div class="card-header">
                            <h3><i class="fas fa-clock"></i> Recent Orders</h3>
                        </div>
                        <div class="card-body" id="recent-orders"></div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <h3><i class="fas fa-exclamation-circle"></i> Pending Payments</h3>
                        </div>
                        <div class="card-body" id="pending-payments"></div>
                    </div>
                </div>
            </section>

            <!-- Products Tab -->
            <section id="products-tab" class="tab-content">
                <div class="tab-header">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="product-search" placeholder="Search products...">
                    </div>
                    <button class="btn btn-primary" onclick="openProductModal()">
                        <i class="fas fa-plus"></i> Add Product
                    </button>
                </div>
                <div id="products-table"></div>
            </section>

            <!-- Orders Tab -->
            <section id="orders-tab" class="tab-content">
                <div class="tab-header">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="order-search" placeholder="Search orders...">
                    </div>
                    <select id="order-status-filter">
                        <option value="all">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="shipped">Shipped</option>
                        <option value="delivered">Delivered</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
                <div id="orders-table"></div>
            </section>

            <!-- Payments Tab -->
            <section id="payments-tab" class="tab-content">
                <div class="tab-header">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="payment-search" placeholder="Search payments...">
                    </div>
                </div>
                <div id="payments-table"></div>
            </section>

            <!-- Customers Tab -->
            <section id="customers-tab" class="tab-content">
                <div class="tab-header">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="customer-search" placeholder="Search customers...">
                    </div>
                </div>
                <div id="customers-table"></div>
            </section>

            <!-- Leads Tab -->
            <section id="leads-tab" class="tab-content">
                <div class="tab-header">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="lead-search" placeholder="Search leads...">
                    </div>
                    <div class="filter-btns">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn hot" data-filter="hot">🔥 Hot</button>
                        <button class="filter-btn warm" data-filter="warm">🌡️ Warm</button>
                        <button class="filter-btn cold" data-filter="cold">❄️ Cold</button>
                    </div>
                    <button class="btn btn-primary" onclick="openLeadModal()">
                        <i class="fas fa-plus"></i> Add Lead
                    </button>
                </div>
                <div id="leads-table"></div>
            </section>

            <section id="daily-report-tab" class="tab-content">
                <div class="tab-header">
                    <div class="tab-header-left">
                        <h2><i class="fas fa-chart-line"></i> Sales Report</h2>
                    </div>
                    <div class="report-filters">
                        <button class="report-filter-btn active" data-filter="today" onclick="setReportFilter('today')">
                            <i class="fas fa-calendar-day"></i>
                            <span>Today</span>
                        </button>
                        <button class="report-filter-btn" data-filter="yesterday" onclick="setReportFilter('yesterday')">
                            <i class="fas fa-calendar-minus"></i>
                            <span>Yesterday</span>
                        </button>
                        <button class="report-filter-btn" data-filter="this_week" onclick="setReportFilter('this_week')">
                            <i class="fas fa-calendar-week"></i>
                            <span>This Week</span>
                        </button>
                        <button class="report-filter-btn" data-filter="this_month" onclick="setReportFilter('this_month')">
                            <i class="fas fa-calendar-alt"></i>
                            <span>This Month</span>
                        </button>
                        <button class="report-filter-btn" data-filter="this_year" onclick="setReportFilter('this_year')">
                            <i class="fas fa-calendar"></i>
                            <span>This Year</span>
                        </button>
                        <button class="report-filter-btn" data-filter="lifetime" onclick="setReportFilter('lifetime')">
                            <i class="fas fa-infinity"></i>
                            <span>Lifetime</span>
                        </button>
                    </div>
                </div>
                
                <div id="daily-report-content">
                    <!-- Report content will be rendered here -->
                    <div class="loading-placeholder">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading report...</p>
                    </div>
                </div>
            </section>
        </main>

        
    </div>
    

    <!-- Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="product-modal-title"><i class="fas fa-box"></i> Add Product</h3>
                <button class="modal-close" onclick="closeModal('product-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="product-edit-serial">
                <div class="form-row">
                    <div class="form-group">
                        <label>Serial No *</label>
                        <input type="text" id="product-serial" placeholder="e.g., S NO 1">
                    </div>
                    <div class="form-group">
                        <label>Product Name *</label>
                        <input type="text" id="product-name" placeholder="e.g., Banarasi Silk Saree">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="product-category">
                            <option value="Silk">Silk</option>
                            <option value="Cotton">Cotton</option>
                            <option value="Georgette">Georgette</option>
                            <option value="Chiffon">Chiffon</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price (₹) *</label>
                        <input type="number" id="product-price" placeholder="e.g., 2500">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Color</label>
                        <input type="text" id="product-color" placeholder="e.g., Red">
                    </div>
                    <div class="form-group">
                        <label>Fabric</label>
                        <input type="text" id="product-fabric" placeholder="e.g., Pure Silk">
                    </div>
                </div>
                <div class="form-group">
                    <label>Stock Quantity</label>
                    <input type="number" id="product-stock" value="10" min="0">
                </div>
                <div class="form-group">
                    <label>Image URL (Google Drive)</label>
                    <input type="url" id="product-image" placeholder="https://drive.google.com/...">
                    <div id="product-image-preview" class="image-preview"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('product-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveProduct()">
                    <i class="fas fa-save"></i> Save
                </button>
            </div>
        </div>
    </div>

    <!-- Order Modal -->
    <div id="order-modal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3><i class="fas fa-shopping-cart"></i> Order Details</h3>
                <button class="modal-close" onclick="closeModal('order-modal')">&times;</button>
            </div>
            <div class="modal-body" id="order-modal-body"></div>
        </div>
    </div>

    <!-- Lead Modal -->
    <div id="lead-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="lead-modal-title"><i class="fas fa-fire"></i> Add Lead</h3>
                <button class="modal-close" onclick="closeModal('lead-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="lead-edit-phone">
                <div class="form-row">
                    <div class="form-group">
                        <label>Name *</label>
                        <input type="text" id="lead-name" placeholder="Customer name">
                    </div>
                    <div class="form-group">
                        <label>Phone *</label>
                        <input type="tel" id="lead-phone" placeholder="10 digit number">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Interest Level *</label>
                        <select id="lead-status">
                            <option value="Hot">🔥 Hot - Bahut Interested</option>
                            <option value="Warm">🌡️ Warm - Interested</option>
                            <option value="Cold">❄️ Cold - Thoda Interest</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Source</label>
                        <select id="lead-source">
                            <option value="WhatsApp">WhatsApp</option>
                            <option value="Instagram">Instagram</option>
                            <option value="Facebook">Facebook</option>
                            <option value="Referral">Referral</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Interested Product</label>
                    <input type="text" id="lead-product" placeholder="e.g., S NO 5 - Red Saree">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Follow-up Date</label>
                        <input type="date" id="lead-followup-date">
                    </div>
                    <div class="form-group">
                        <label>Follow-up Time</label>
                        <input type="time" id="lead-followup-time" value="10:00">
                    </div>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="lead-notes" rows="3" placeholder="Customer ke baare mein notes..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('lead-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveLead()">
                    <i class="fas fa-save"></i> Save Lead
                </button>
            </div>
        </div>
    </div>

    <!-- Followup Modal -->
    <div id="followup-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fab fa-whatsapp"></i> Send Followup Message</h3>
                <button class="modal-close" onclick="closeModal('followup-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="followup-phone">
                <input type="hidden" id="followup-name">
                <div class="form-group">
                    <label>Message Template</label>
                    <select id="followup-template" onchange="updateFollowupMessage()">
                        <option value="reminder">📢 Product Reminder</option>
                        <option value="discount">🎁 Discount Offer</option>
                        <option value="newstock">✨ New Stock Alert</option>
                        <option value="custom">✏️ Custom Message</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="followup-message" rows="6"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('followup-modal')">Cancel</button>
                <button class="btn btn-success" onclick="sendFollowupMessage()">
                    <i class="fab fa-whatsapp"></i> Send WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
